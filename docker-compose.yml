# Infrastructure de développement : PostgreSQL 16 + PostGIS, Redis, stockage S3 (SeaweedFS).
# Démarrage : pnpm infra:up   —   Arrêt : pnpm infra:down
name: lvb

services:
  postgres:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lvb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lvb_dev}
      POSTGRES_DB: ${POSTGRES_DB:-lvb}
      TZ: Africa/Algiers
      PGTZ: Africa/Algiers
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lvb}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data

  s3:
    # Stockage compatible S3 (SeaweedFS) : l'image MinIO n'est plus publiée (voir DECISIONS.md D11).
    # Identifiants de dev dans infra/seaweedfs/s3.json (= S3_ACCESS_KEY / S3_SECRET_KEY de .env.example).
    image: chrislusf/seaweedfs:latest
    restart: unless-stopped
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json -volume.max=0
    ports:
      - "${S3_PORT:-9000}:8333"
    volumes:
      - s3data:/data
      - ./infra/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro

volumes:
  pgdata:
  redisdata:
  s3data:
